<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11162b" />
      <stop offset="60%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Swirl Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="40%" stop-color="#00a8ff" />
      <stop offset="80%" stop-color="#4455ff" />
      <stop offset="100%" stop-color="#9933ff" />
    </linearGradient>

    <linearGradient id="magentaOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1493" />
      <stop offset="40%" stop-color="#ff007f" />
      <stop offset="70%" stop-color="#ff7b54" />
      <stop offset="100%" stop-color="#ffb38a" />
    </linearGradient>

    <linearGradient id="ribbonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="35%" stop-color="#7c4dff" />
      <stop offset="70%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#ffd54f" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6ec7" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Glass Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Ambient Glow Behind Orb -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" />

  <!-- Orbit Crosshairs and Coordinate Grid -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3" />
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <ellipse cx="256" cy="256" rx="180" ry="110" transform="rotate(-25 256 256)" fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4" />

  <!-- Swirling Flowing Ribbon Loops (Toroidal Celestial Orb) -->
  <g filter="url(#softGlow)">
    <!-- Cyan / Blue outer vortex -->
    <path d="M 140 260 C 130 180, 200 130, 270 140 C 350 150, 390 220, 370 290 C 350 360, 270 380, 200 360 C 140 340, 150 280, 210 270 C 270 260, 320 290, 340 250 C 360 210, 320 170, 270 175 C 220 180, 175 220, 185 270" 
      fill="none" stroke="url(#cyanBlue)" stroke-width="8" stroke-linecap="round" opacity="0.95" />

    <!-- Magenta / Coral inner vortex swirl -->
    <path d="M 370 240 C 385 320, 310 380, 240 370 C 170 360, 120 290, 145 220 C 170 150, 245 130, 315 155 C 375 175, 360 240, 305 250 C 245 260, 195 230, 175 270 C 155 310, 195 345, 250 340 C 300 335, 340 300, 330 245" 
      fill="none" stroke="url(#magentaOrange)" stroke-width="7" stroke-linecap="round" opacity="0.95" />

    <!-- Core loop ribbon -->
    <path d="M 220 210 C 260 170, 330 180, 335 230 C 340 280, 280 320, 230 300 C 190 280, 200 230, 250 230 C 290 230, 300 270, 270 285" 
      fill="none" stroke="url(#ribbonViolet)" stroke-width="6" stroke-linecap="round" opacity="0.9" />

    <!-- Fine strand energy lines -->
    <ellipse cx="256" cy="256" rx="130" ry="95" transform="rotate(35 256 256)" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.75" />
    <ellipse cx="256" cy="256" rx="115" ry="85" transform="rotate(-40 256 256)" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.7" />
    <ellipse cx="256" cy="256" rx="90" ry="65" transform="rotate(15 256 256)" fill="none" stroke="#ffb38a" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Celestial Nodes / Planetary Dots -->
  <circle cx="180" cy="180" r="4.5" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="215" cy="225" r="4" fill="#00f5ff" />
  <circle cx="340" cy="190" r="3.5" fill="#ff7b54" />
  <circle cx="330" cy="300" r="4" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="210" cy="335" r="3.5" fill="#00e5ff" />
  <circle cx="150" cy="290" r="3" fill="#ff007f" />
  <circle cx="380" cy="235" r="3" fill="#7c4dff" />
  <circle cx="130" cy="220" r="2.5" fill="#00f5ff" />
  <circle cx="325" cy="370" r="3.5" fill="#ff4081" />

  <!-- Star Sparkles in Background -->
  <path d="M 190 135 L 193 145 L 203 148 L 193 151 L 190 161 L 187 151 L 177 148 L 187 145 Z" fill="#ffffff" opacity="0.85" />
  <path d="M 325 135 L 327 142 L 334 144 L 327 146 L 325 153 L 323 146 L 316 144 L 323 142 Z" fill="#38bdf8" opacity="0.8" />
  <circle cx="280" cy="130" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="136" cy="190" r="2" fill="#ff77a9" opacity="0.8" />
  <circle cx="365" cy="185" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="378" cy="340" r="2" fill="#ffffff" opacity="0.7" />
</svg>
